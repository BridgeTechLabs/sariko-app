on:
  push:
    branches:
      - develop
jobs:
  build:
    name: build-test-migrate-push
    runs-on: ubuntu-latest
    environment:
      name: development
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --platform linux/amd64 -t sariko/sariko-backend:${GITHUB_SHA::7} backend

      - name: Test inside that image
        run: |
          docker run --rm \
            -v "$PWD/tests:/tests:ro" \
            -e PYTHONPATH=/www \
            -w /tests/backend \
            sariko/sariko-backend:${GITHUB_SHA::7} \
            pytest -v -p no:cacheprovider

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply DB migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          cd backend
          supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes

      - name: Push the tested image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker push sariko/sariko-backend:${GITHUB_SHA::7}

  deploy:
    name: deploy
    needs: build
    runs-on:
      labels: ec2-sariko-app-dev
    environment:
      name: development
    steps:
      - name: Deploy app
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          export IMAGE_TAG=${GITHUB_SHA::7}
          cd ~/deploy
          ./get_prev_image_tag.sh
          # ~/deploy/.env: what's running, and docker compose reads it, so a manual `docker compose up -d` keeps the tag
          printf 'PREV_IMAGE_TAG=%s\nIMAGE_TAG=%s\n' "$(cat /tmp/previous_tag.txt)" "$IMAGE_TAG" > .env
          docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_TOKEN
          docker compose pull
          docker compose up -d

      - name: check readiness and rollback
        run: |
          cd ~/deploy
          ./check_readiness_and_rollback.sh || {
            printf 'IMAGE_TAG=%s\nROLLED_BACK_FROM=%s\n' "$(cat /tmp/previous_tag.txt)" "${GITHUB_SHA::7}" > .env
            exit 1
          }

      # Only after a healthy deploy (skipped on rollback). Keeps current + previous tag for the next rollback.
      - name: Clean up old images
        run: |
          cd ~/deploy
          ./cleanup_docker_images.sh
          docker image prune -f

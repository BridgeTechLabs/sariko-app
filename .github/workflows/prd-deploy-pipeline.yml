on:
  push:
    branches:
      - main
jobs:
  build:
    name: build-test-migrate-push
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --platform linux/amd64 -t sariko/sariko-backend:${GITHUB_SHA::7} backend

      - name: Test inside that image
        run: |
          docker run --rm \
            -v "$PWD/tests:/tests:ro" \
            -v "$PWD/frontend/src:/frontend/src:ro" \
            -v "$PWD/backend/supabase/migrations:/backend/supabase/migrations:ro" \
            -e PYTHONPATH=/www \
            -w /tests/backend \
            sariko/sariko-backend:${GITHUB_SHA::7} \
            pytest -v -p no:cacheprovider

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply DB migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          cd backend
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
          supabase db push --db-url "$SUPABASE_DB_URL" --yes

      - name: Push the tested image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker push sariko/sariko-backend:${GITHUB_SHA::7}

  deploy:
    name: deploy
    needs: build
    runs-on:
      labels: ec2-sariko-app
    environment:
      name: production
    steps:
      - name: Deploy, check readiness, clean up
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # One docker deploy per host at a time (app + admin share this EC2 and the image store): a second one waits.
          # The lock is held until this step ends, so pull/up, readiness (+ rollback) and cleanup are never interleaved.
          exec 9>~/.sariko-docker.lock
          flock -n 9 || { echo "Waiting for the other deploy on this host..."; flock -w 900 9 || { echo "::error::another deploy holds the lock"; exit 1; }; }
          export IMAGE_TAG=${GITHUB_SHA::7}
          cd ~/deploy
          ./get_prev_image_tag.sh
          # NOT .env: on prod ~/deploy/.env is the backend env_file (all secrets). Manual run: docker compose --env-file image_tags.env up -d
          printf 'PREV_IMAGE_TAG=%s\nIMAGE_TAG=%s\n' "$(cat /tmp/previous_tag.txt)" "$IMAGE_TAG" > image_tags.env
          docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_TOKEN
          docker compose pull
          docker compose up -d

          # The script rolls back by itself on a failed readiness; then record the rollback and fail the job
          ./check_readiness_and_rollback.sh || {
            printf 'IMAGE_TAG=%s\nROLLED_BACK_FROM=%s\n' "$(cat /tmp/previous_tag.txt)" "${GITHUB_SHA::7}" > image_tags.env
            exit 1
          }

          # Only after a healthy deploy (skipped on rollback). Keeps current + previous tag for the next rollback.
          ./cleanup_docker_images.sh
          docker image prune -f

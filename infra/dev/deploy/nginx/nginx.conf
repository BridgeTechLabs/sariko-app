# Shared nginx for every app on this EC2. Edit in the repo, push with infra/sync.sh dev --apply.
# T203 (BM11, seller-menu đợt 4A N1): requests per client IP on the app API, nginx's own leaky bucket (no app code).
# rate = the steady pace allowed, burst = what may come at once above it, then 429. Measured 13/11 on DEV: one normal
# buyer + seller round = 146 requests in 47 s, peak 15 in 1 s and 53 in 10 s. 4r/s + burst 160: that round never
# waits; a tool at 300 calls / 28 s (BM11) gets 429 after ~270. Known limit: many phones behind one carrier IP (CGNAT).
# Test scripts on DEV must go at a person's pace (pauses between screens), or they get 429 too.
# Machine-to-machine paths get an empty key, which nginx does not count: the VNPay IPN, the Lalamove / AllinGo
# webhooks, the Admin Gateway (the admin backend calls it through the public URL).
map $uri $api_limit_key {
    default                          $binary_remote_addr;
    /rest/v1/payments/vnpay/ipn      "";
    ~^/rest/v1/deliveries/webhook    "";
    ~^/rest/v1/admin-gateway/        "";
}
limit_req_zone $api_limit_key zone=api_per_ip:10m rate=4r/s;

server {
    listen 80;
    server_name api-dev.sariko.store;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api-dev.sariko.store;
    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/api-dev.sariko.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-dev.sariko.store/privkey.pem;

    location / {
        limit_req zone=api_per_ip burst=160 nodelay;   # T203: see the top of this file
        limit_req_status 429;
        # Resolve at request time: each deploy recreates the container with a new IP, and a name fixed at nginx
        # start kept the old one (2026-11-11: 502 after deploy, the old IP went to certbot).
        resolver 127.0.0.11 valid=5s;   # a deploy's new IP is used within 5 s
        set $app_backend http://backend:5000;
        proxy_pass $app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api-admin-dev.sariko.store;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api-admin-dev.sariko.store;

    ssl_certificate /etc/letsencrypt/live/api-admin-dev.sariko.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-admin-dev.sariko.store/privkey.pem;

    # Menu import uploads many food images in one request; nginx default is 1m
    client_max_body_size 100m;

    location / {
        # Resolve the container at request time via Docker DNS, so nginx still starts/reloads
        # (and keeps serving api-dev.sariko.store) when the admin container is down.
        resolver 127.0.0.11 valid=30s;
        set $admin_backend http://sariko-admin-dev-backend:5000;
        proxy_pass $admin_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

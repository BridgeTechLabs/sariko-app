# Shared nginx for every app on this EC2. Edit in the repo, push with infra/sync.sh dev --apply.
server {
    listen 80;
    server_name api-dev.sariko.store;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api-dev.sariko.store;
    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/api-dev.sariko.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-dev.sariko.store/privkey.pem;

    location / {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

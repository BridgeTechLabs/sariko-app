server {
    listen 80;
    server_name api.local.bridgeai.pro;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.sariko.store;
    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/api.sariko.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sariko.store/privkey.pem;

    location / {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api-admin.sariko.store;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api-admin.sariko.store;

    ssl_certificate /etc/letsencrypt/live/api-admin.sariko.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-admin.sariko.store/privkey.pem;

    # Menu import uploads many food images in one request; nginx default is 1m
    client_max_body_size 100m;

    location / {
        # Resolve the container at request time via Docker DNS, so nginx still starts/reloads
        # (and keeps serving api.sariko.store) when the admin container is down.
        resolver 127.0.0.11 valid=30s;
        set $admin_backend http://sariko-admin-backend:5000;
        proxy_pass $admin_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
